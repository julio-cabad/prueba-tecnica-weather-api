AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API de clima. API Gateway REST y Lambda adaptan Open-Meteo a un contrato propio.

Parameters:
  GeocodingBaseUrl:
    Type: String
    Default: https://geocoding-api.open-meteo.com
    Description: Origen del servicio de geocoding. Sin path y sin credenciales.
  ForecastBaseUrl:
    Type: String
    Default: https://api.open-meteo.com
    Description: Origen del servicio de forecast. Sin path y sin credenciales.
  UpstreamTimeoutMs:
    Type: String
    Default: "5000"
    AllowedPattern: "^[0-9]+$"
    Description: Presupuesto total por petición para Open-Meteo (geocoding + forecast), en milisegundos. La aplicación acepta de 100 a 5000.
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
    Description: x86_64 corre en cualquier host con sam local. arm64 (Graviton) es más barato en AWS y nativo en Apple Silicon.
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - !Ref Architecture
    # Open-Meteo tiene 5 s en total por petición. Los 10 s dejan margen para un
    # arranque en frío y para responder el 502 antes de que la Lambda muera.
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        GEOCODING_BASE_URL: !Ref GeocodingBaseUrl
        FORECAST_BASE_URL: !Ref ForecastBaseUrl
        UPSTREAM_TIMEOUT_MS: !Ref UpstreamTimeoutMs
        LOG_LEVEL: !Ref LogLevel
    Tags:
      Project: weather-api

Resources:
  WeatherApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: weather-api
      StageName: Prod
      EndpointConfiguration: REGIONAL
      # Lo que API Gateway responde sin llegar a la Lambda (throttling, Lambda
      # caída o sin respuesta) sale con el mismo sobre de error y con el status
      # que ese código tiene en el resto del contrato. SAM lo escribe en la
      # definición del API. MISSING_AUTHENTICATION_TOKEN es una ruta sin método:
      # no debería ocurrir con los ANY de abajo, pero queda de respaldo.
      GatewayResponses:
        MISSING_AUTHENTICATION_TOKEN:
          StatusCode: "404"
          ResponseTemplates:
            application/json: '{"error":{"code":"NOT_FOUND","message":"La ruta no existe. Usa GET /weather?city={ciudad}."}}'
        THROTTLED:
          StatusCode: "429"
          ResponseTemplates:
            application/json: '{"error":{"code":"TOO_MANY_REQUESTS","message":"Demasiadas peticiones. Intenta de nuevo en unos segundos."}}'
        DEFAULT_4XX:
          StatusCode: "400"
          ResponseTemplates:
            application/json: '{"error":{"code":"INVALID_REQUEST","message":"La petición no es válida."}}'
        # El enunciado: cualquier error no controlado es 500 INTERNAL_ERROR.
        DEFAULT_5XX:
          StatusCode: "500"
          ResponseTemplates:
            application/json: '{"error":{"code":"INTERNAL_ERROR","message":"Ocurrió un error interno."}}'

  GetWeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: weather-get-current
      CodeUri: dist/
      Handler: handler.handler
      Description: Consulta el clima actual de una ciudad y lo devuelve en el contrato propio.
      # El contrato es GET /weather, pero API Gateway REST no distingue una ruta
      # inexistente de un método no soportado. Toda ruta y método llega a la
      # Lambda, que responde 404 NOT_FOUND o 405 METHOD_NOT_ALLOWED con el mismo
      # sobre, X-Request-Id y log, igual en AWS que en sam local.
      Events:
        Weather:
          Type: Api
          Properties:
            RestApiId: !Ref WeatherApi
            Path: /weather
            Method: any
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref WeatherApi
            Path: /
            Method: any
        OtherPaths:
          Type: Api
          Properties:
            RestApiId: !Ref WeatherApi
            Path: /{proxy+}
            Method: any

Outputs:
  WeatherApiBaseUrl:
    Description: URL base del stage
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  WeatherEndpoint:
    Description: Endpoint GET /weather
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/weather"
