AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API de clima. API Gateway REST y Lambda adaptan Open-Meteo a un contrato propio.

Parameters:
  GeocodingBaseUrl:
    Type: String
    Default: https://geocoding-api.open-meteo.com
    Description: Origen del servicio de geocoding. Sin path y sin credenciales.
  ForecastBaseUrl:
    Type: String
    Default: https://api.open-meteo.com
    Description: Origen del servicio de forecast. Sin path y sin credenciales.
  UpstreamTimeoutMs:
    Type: String
    Default: "5000"
    AllowedPattern: "^[0-9]+$"
    Description: Presupuesto total por petición para Open-Meteo (geocoding + forecast), en milisegundos. La aplicación acepta de 100 a 5000.
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    # Open-Meteo tiene 5 s en total por petición. Los 10 s dejan margen para un
    # arranque en frío y para responder el 502 antes de que la Lambda muera.
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        GEOCODING_BASE_URL: !Ref GeocodingBaseUrl
        FORECAST_BASE_URL: !Ref ForecastBaseUrl
        UPSTREAM_TIMEOUT_MS: !Ref UpstreamTimeoutMs
        LOG_LEVEL: !Ref LogLevel
    Tags:
      Project: weather-api

Resources:
  WeatherApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: weather-api
      StageName: Prod
      EndpointConfiguration: REGIONAL
      # Los errores que genera API Gateway (ruta o método inexistente,
      # throttling, Lambda caída o sin respuesta) nunca llegan a la Lambda.
      # SAM los escribe en la definición del API con el mismo sobre de error.
      GatewayResponses:
        MISSING_AUTHENTICATION_TOKEN:
          StatusCode: "404"
          ResponseTemplates:
            application/json: '{"error":{"code":"INVALID_REQUEST","message":"La ruta o el método no existe. Usa GET /weather?city={ciudad}."}}'
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error":{"code":"INVALID_REQUEST","message":"La petición no fue aceptada."}}'
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error":{"code":"INTERNAL_ERROR","message":"Ocurrió un error interno."}}'

  GetWeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: weather-get-current
      CodeUri: dist/
      Handler: handler.handler
      Description: Consulta el clima actual de una ciudad y lo devuelve en el contrato propio.
      Events:
        GetWeather:
          Type: Api
          Properties:
            RestApiId: !Ref WeatherApi
            Path: /weather
            Method: get

Outputs:
  WeatherApiBaseUrl:
    Description: URL base del stage
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  WeatherEndpoint:
    Description: Endpoint GET /weather
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/weather"
